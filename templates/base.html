<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="description" content="This is a login page template based on Bootstrap 5">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="{% static 'styles/homestyle.css' %}" rel="stylesheet">
    <link href="{% static 'styles/aboutus.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
	<title>{% block title %}Blood Bank Management{% endblock %}</title>
</head>
<body {% block body_attributes %}{% endblock %}>
    <nav class="navbar navbar-expand-lg  navbar-light  py-2"  >
		<div class="container" >
		  <a href="{% url 'homepage' %}" class="navbar-brand"><img class="logoimage" src="{% static 'images/logo/nbb.jpeg' %}"  width="80" height="80"><b> National Blood Bank of Ethiopia</b> </a>
		  <button
			class="navbar-toggler"
			type="button"
			data-bs-toggle="collapse"
			data-bs-target="#navmenu"
		  >
			<span class="navbar-toggler-icon" style="background-color:gray;"></span>

		  </button>
  
		  <div class="collapse navbar-collapse" id="navmenu">
			<ul class="navbar-nav ms-auto justify-content-end">
			  <li class="nav-item">
				<a href="{% url 'aboutus' %}" class="nav-link" style="color: black;" onmouseenter="this.style.backgroundColor='red';this.style.color = 'white';" onmouseleave="this.style.backgroundColor='white';this.style.color = 'black';" ><b>About Us</b></a>
			  </li>
			<li class="nav-item">
				<a href="{% url 'login' %}" class="nav-link" style="color: black;"onmouseenter="this.style.backgroundColor='red';this.style.color = 'white';" onmouseleave="this.style.backgroundColor='white';this.style.color = 'black';"  > <b> Login</b></a>
			  </li>
			  
			</ul>
		  </div>
		</div>
	  </nav>

    {% block content  %}

    {% endblock %}

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
